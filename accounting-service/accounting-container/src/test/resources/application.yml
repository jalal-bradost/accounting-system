accounting:
  seed:
    demo-business-data: false
  currencies:
    seed: true
    base:
      code: USD
      symbol: "$"
      name: United States dollar
    extras:
      - code: IQD
        symbol: "IQD"
        name: Iraqi dinar
        rate-per-usd: "1310.000000"
        active: true

app:
  messaging:
    enabled: false

spring:
  application:
    name: accounting-service-test
  rabbitmq:
    listener:
      simple:
        auto-startup: false

---
spring:
  config:
    activate:
      on-profile: "!postgres"
  datasource:
    url: jdbc:h2:mem:accounting_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
