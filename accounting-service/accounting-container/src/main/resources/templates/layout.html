<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${(pageTitle != null) ? (pageTitle + ' - Accounting') : 'Accounting'}">Accounting</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link th:href="@{/css/dashboard.css}" rel="stylesheet"/>
</head>
<body>
  <div class="layout-wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="layout-page">
      <div th:replace="~{fragments/navbar :: navbar(${(pageTitle != null) ? pageTitle : 'Dashboard'})}"></div>
      <main class="layout-content">
        <th:block th:replace="${content}"/>
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>
</html>
