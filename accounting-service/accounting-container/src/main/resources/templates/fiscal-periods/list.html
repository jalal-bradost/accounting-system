<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<head>
  <meta charset="UTF-8"/>
  <title>Fiscal Periods</title>
</head>
<body>
<th:block th:fragment="content">
  <div class="page-header">
    <h1 class="page-title">Fiscal Periods</h1>
  </div>
  <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
  <div class="card mb-4">
    <div class="card-header">Create period</div>
    <div class="card-body">
      <form th:action="@{/web/fiscal-periods}" method="post" class="row g-3">
        <div class="col-auto">
          <label for="startDate" class="form-label">Start date</label>
          <input type="date" id="startDate" name="startDate" class="form-control" required="required"/>
        </div>
        <div class="col-auto">
          <label for="endDate" class="form-label">End date</label>
          <input type="date" id="endDate" name="endDate" class="form-control" required="required"/>
        </div>
        <div class="col-auto">
          <div class="form-check mt-4">
            <input type="checkbox" id="open" name="open" class="form-check-input" value="true" checked="checked"/>
            <input type="hidden" name="open" value="false"/>
            <label for="open" class="form-check-label">Open</label>
          </div>
        </div>
        <div class="col-auto d-flex align-items-end">
          <button type="submit" class="btn btn-primary">Create</button>
        </div>
      </form>
    </div>
  </div>
  <div class="card">
    <div class="card-header">Periods</div>
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead>
          <tr>
            <th>Start</th>
            <th>End</th>
            <th>Open</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="p : ${periods}">
            <td th:text="${p.startDate()}">-</td>
            <td th:text="${p.endDate()}">-</td>
            <td><span th:if="${p.open()}" class="badge bg-success">Yes</span><span th:unless="${p.open()}" class="badge bg-secondary">No</span></td>
          </tr>
          <tr th:if="${#lists.isEmpty(periods)}">
            <td colspan="3" class="text-muted">No fiscal periods. Create one above.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</th:block>
</body>
</html>
