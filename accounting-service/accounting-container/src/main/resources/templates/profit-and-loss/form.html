<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<head>
  <meta charset="UTF-8"/>
  <title>Profit and Loss</title>
</head>
<body>
<th:block th:fragment="content">
  <div class="page-header">
    <h1 class="page-title">Profit and Loss</h1>
  </div>
  <div class="card">
    <div class="card-header">Date range</div>
    <div class="card-body">
      <form th:action="@{/web/profit-and-loss}" method="get" class="row g-3">
        <div class="col-auto">
          <label for="from" class="form-label">From</label>
          <input type="date" id="from" name="from" class="form-control" required="required"/>
        </div>
        <div class="col-auto">
          <label for="to" class="form-label">To</label>
          <input type="date" id="to" name="to" class="form-control" required="required"/>
        </div>
        <div class="col-auto d-flex align-items-end">
          <button type="submit" class="btn btn-primary">Show P&amp;L</button>
        </div>
      </form>
    </div>
  </div>
</th:block>
</body>
</html>
