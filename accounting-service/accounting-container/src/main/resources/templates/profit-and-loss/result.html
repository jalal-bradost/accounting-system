<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<head>
  <meta charset="UTF-8"/>
  <title>Profit and Loss</title>
</head>
<body>
<th:block th:fragment="content">
  <div class="page-header">
    <h1 class="page-title">Profit and Loss</h1>
    <a th:href="@{/web/profit-and-loss}" class="btn btn-outline-secondary">New report</a>
  </div>
  <p class="text-muted" th:text="'From ' + ${from} + ' to ' + ${to}">-</p>

  <div class="card mb-3">
    <div class="card-header">Revenue</div>
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead>
          <tr>
            <th>Account</th>
            <th class="text-end">Amount</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="line : ${report.revenue()}">
            <td>
              <span th:if="${accountMap != null && accountMap[line.accountId()] != null}" th:text="${accountMap[line.accountId()].code + ' - ' + accountMap[line.accountId()].name}">-</span>
              <span th:unless="${accountMap != null && accountMap[line.accountId()] != null}" th:text="${line.accountId()}">-</span>
            </td>
            <td class="text-end" th:text="${line.amount()}">-</td>
          </tr>
          <tr th:if="${#lists.isEmpty(report.revenue())}">
            <td colspan="2" class="text-muted">No revenue in this period.</td>
          </tr>
          <tr class="table-light fw-semibold" th:if="${!#lists.isEmpty(report.revenue())}">
            <td>Total revenue</td>
            <td class="text-end" th:text="${report.totalRevenue()}">-</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="card mb-3">
    <div class="card-header">Expenses</div>
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead>
          <tr>
            <th>Account</th>
            <th class="text-end">Amount</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="line : ${report.expenses()}">
            <td>
              <span th:if="${accountMap != null && accountMap[line.accountId()] != null}" th:text="${accountMap[line.accountId()].code + ' - ' + accountMap[line.accountId()].name}">-</span>
              <span th:unless="${accountMap != null && accountMap[line.accountId()] != null}" th:text="${line.accountId()}">-</span>
            </td>
            <td class="text-end" th:text="${line.amount()}">-</td>
          </tr>
          <tr th:if="${#lists.isEmpty(report.expenses())}">
            <td colspan="2" class="text-muted">No expenses in this period.</td>
          </tr>
          <tr class="table-light fw-semibold" th:if="${!#lists.isEmpty(report.expenses())}">
            <td>Total expenses</td>
            <td class="text-end" th:text="${report.totalExpenses()}">-</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <div class="card-body d-flex justify-content-between align-items-center">
      <span class="fw-semibold">Net income</span>
      <span class="fs-5 fw-semibold" th:text="${report.netIncome()}">-</span>
    </div>
  </div>
</th:block>
</body>
</html>
