<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<head>
  <meta charset="UTF-8"/>
  <title>Journal Entry</title>
</head>
<body>
<th:block th:fragment="content">
  <div class="page-header">
    <h1 class="page-title">Journal Entry <span th:text="${entry.sequenceNumber}">-</span></h1>
    <a th:href="@{/web/journal-entries}" class="btn btn-outline-secondary">Back to list</a>
  </div>
  <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
  <div class="card mb-4">
    <div class="card-header">Details</div>
    <div class="card-body">
      <dl class="row mb-0">
        <dt class="col-sm-2">Date</dt>
        <dd class="col-sm-4" th:text="${entry.date}">-</dd>
        <dt class="col-sm-2">Status</dt>
        <dd class="col-sm-4"><span class="badge" th:classappend="${entry.status.name() == 'POSTED'} ? 'bg-success' : 'bg-secondary'" th:text="${entry.status}">-</span></dd>
        <dt class="col-sm-2">Currency</dt>
        <dd class="col-sm-4" th:text="${entry.currencyCode != null} ? ${entry.currencyCode} : '-'">-</dd>
      </dl>
      <div th:if="${entry.status.name() == 'DRAFT'}" class="mt-3">
        <form th:action="@{/web/journal-entries/{id}/post(id=${entry.id})}" method="post" class="d-inline">
          <button type="submit" class="btn btn-success">Post</button>
        </form>
        <form th:action="@{/web/journal-entries/{id}/reverse(id=${entry.id})}" method="post" class="d-inline ms-2">
          <input type="text" name="reason" placeholder="Reason for reversal" class="form-control form-control-sm d-inline-block w-auto" value="Reversal from dashboard"/>
          <button type="submit" class="btn btn-warning">Reverse</button>
        </form>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-header">Lines</div>
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead>
          <tr>
            <th>Account</th>
            <th>Label</th>
            <th class="text-end">Debit</th>
            <th class="text-end">Credit</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="item : ${entry.items}">
            <td th:text="${item.accountId}">-</td>
            <td th:text="${item.label != null} ? ${item.label} : '-'">-</td>
            <td class="text-end" th:text="${item.debit != null ? item.debit : ''}">-</td>
            <td class="text-end" th:text="${item.credit != null ? item.credit : ''}">-</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</th:block>
</body>
</html>
