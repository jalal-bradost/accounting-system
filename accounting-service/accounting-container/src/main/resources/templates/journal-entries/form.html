<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<head>
  <meta charset="UTF-8"/>
  <title>New Journal Entry</title>
</head>
<body>
<th:block th:fragment="content">
  <div class="page-header">
    <h1 class="page-title">New Journal Entry</h1>
    <a th:href="@{/web/journal-entries}" class="btn btn-outline-secondary">Back to list</a>
  </div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
  <div class="card">
    <div class="card-header">Create journal entry</div>
    <div class="card-body">
      <form th:action="@{/web/journal-entries}" th:object="${createEntryForm}" method="post">
        <div class="row mb-3">
          <div class="col-md-4">
            <label for="journalId" class="form-label">Journal</label>
            <select id="journalId" class="form-select" th:field="*{journalId}" required="required">
              <option value="">-- Select journal --</option>
              <option th:each="j : ${journals}" th:value="${j.id}" th:text="${j.code + ' - ' + j.name}">-</option>
            </select>
          </div>
          <div class="col-md-2">
            <label for="date" class="form-label">Date</label>
            <input type="date" id="date" class="form-control" th:field="*{date}" required="required"/>
          </div>
          <div class="col-md-2">
            <label for="sequenceNumber" class="form-label">Sequence (optional)</label>
            <input type="text" id="sequenceNumber" class="form-control" th:field="*{sequenceNumber}"/>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Lines (account, debit, credit)</label>
          <table class="table table-sm">
            <thead>
              <tr>
                <th>Account</th>
                <th>Label</th>
                <th>Debit</th>
                <th>Credit</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="line, lineStat : *{lines}">
                <td>
                  <select class="form-select form-select-sm" th:field="*{lines[__${lineStat.index}__].accountId}">
                    <option value="">--</option>
                    <option th:each="a : ${accounts}" th:value="${a.id}" th:text="${a.code + ' ' + a.name}">-</option>
                  </select>
                </td>
                <td><input type="text" class="form-control form-control-sm" th:field="*{lines[__${lineStat.index}__].label}" placeholder="Optional"/></td>
                <td><input type="text" class="form-control form-control-sm" th:field="*{lines[__${lineStat.index}__].debit}" placeholder="0"/></td>
                <td><input type="text" class="form-control form-control-sm" th:field="*{lines[__${lineStat.index}__].credit}" placeholder="0"/></td>
              </tr>
            </tbody>
          </table>
        </div>
        <button type="submit" class="btn btn-primary">Create</button>
        <a th:href="@{/web/journal-entries}" class="btn btn-outline-secondary ms-2">Cancel</a>
      </form>
    </div>
  </div>
</th:block>
</body>
</html>
