<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<head>
  <meta charset="UTF-8"/>
  <title>Journals</title>
</head>
<body>
<th:block th:fragment="content">
  <div class="page-header">
    <h1 class="page-title">Journals</h1>
    <a th:href="@{/web/journals/new}" class="btn btn-primary">New Journal</a>
  </div>
  <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
  <div class="card">
    <div class="card-header">Journals</div>
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead>
          <tr>
            <th>Code</th>
            <th>Name</th>
            <th>Type</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="j : ${journals}">
            <td th:text="${j.code}">-</td>
            <td th:text="${j.name}">-</td>
            <td th:text="${j.journalType}">-</td>
          </tr>
          <tr th:if="${#lists.isEmpty(journals)}">
            <td colspan="3" class="text-muted">No journals yet. <a th:href="@{/web/journals/new}">Create one</a>.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</th:block>
</body>
</html>
