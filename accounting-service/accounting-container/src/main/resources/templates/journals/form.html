<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<head>
  <meta charset="UTF-8"/>
  <title>New Journal</title>
</head>
<body>
<th:block th:fragment="content">
  <div class="page-header">
    <h1 class="page-title">New Journal</h1>
    <a th:href="@{/web/journals}" class="btn btn-outline-secondary">Back to list</a>
  </div>
  <div class="card">
    <div class="card-header">Create journal</div>
    <div class="card-body">
      <form th:action="@{/web/journals}" th:object="${createJournalForm}" method="post">
        <div class="mb-3">
          <label for="code" class="form-label">Code</label>
          <input type="text" id="code" class="form-control" th:field="*{code}" required="required"/>
          <p th:if="${#fields.hasErrors('code')}" th:errors="*{code}" class="text-danger small"></p>
        </div>
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input type="text" id="name" class="form-control" th:field="*{name}" required="required"/>
          <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger small"></p>
        </div>
        <div class="mb-3">
          <label for="journalType" class="form-label">Journal type</label>
          <select id="journalType" class="form-select" th:field="*{journalType}">
            <option th:each="t : ${journalTypes}" th:value="${t.name()}" th:text="${t.name()}">MISC</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary">Create</button>
        <a th:href="@{/web/journals}" class="btn btn-outline-secondary ms-2">Cancel</a>
      </form>
    </div>
  </div>
</th:block>
</body>
</html>
