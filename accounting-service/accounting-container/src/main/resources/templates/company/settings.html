<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<head>
  <meta charset="UTF-8"/>
  <title>Company Settings</title>
</head>
<body>
<th:block th:fragment="content">
  <div class="page-header">
    <h1 class="page-title">Company Settings</h1>
  </div>
  <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
  <div class="card">
    <div class="card-header">Period lock date</div>
    <div class="card-body">
      <p class="text-muted">Entries cannot be posted before this date. Set the lock date to close prior periods.</p>
      <form th:action="@{/web/company/settings}" method="post" class="row g-3">
        <div class="col-auto">
          <label for="periodLockDate" class="form-label">Lock date</label>
          <input type="date" id="periodLockDate" name="periodLockDate" class="form-control" required="required"/>
        </div>
        <div class="col-auto d-flex align-items-end">
          <button type="submit" class="btn btn-primary">Update</button>
        </div>
      </form>
    </div>
  </div>
</th:block>
</body>
</html>
