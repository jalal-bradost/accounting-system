<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Error</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
  <div class="card shadow-sm" style="max-width: 28rem;">
    <div class="card-body">
      <h1 class="card-title h4 text-danger">Something went wrong</h1>
      <p class="card-text text-muted" th:if="${message}" th:text="${message}">Unexpected error.</p>
      <p class="card-text text-muted" th:unless="${message}">An unexpected error occurred. Please try again or go back to the dashboard.</p>
      <p class="small text-muted" th:if="${status}" th:text="'Status: ' + ${status}">-</p>
      <a th:href="@{/web}" class="btn btn-primary">Go to Dashboard</a>
    </div>
  </div>
</body>
</html>
