<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<head>
  <meta charset="UTF-8"/>
  <title>Balance Sheet</title>
</head>
<body>
<th:block th:fragment="content">
  <div class="page-header">
    <h1 class="page-title">Balance Sheet</h1>
  </div>
  <div class="card">
    <div class="card-header">As of date</div>
    <div class="card-body">
      <form th:action="@{/web/balance-sheet}" method="get" class="row g-3">
        <div class="col-auto">
          <label for="asOf" class="form-label">As of</label>
          <input type="date" id="asOf" name="asOf" class="form-control" required="required"/>
        </div>
        <div class="col-auto d-flex align-items-end">
          <button type="submit" class="btn btn-primary">Show balance sheet</button>
        </div>
      </form>
    </div>
  </div>
</th:block>
</body>
</html>
