<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<head>
  <meta charset="UTF-8"/>
  <title>General Ledger</title>
</head>
<body>
<th:block th:fragment="content">
  <div class="page-header">
    <h1 class="page-title">General Ledger</h1>
  </div>
  <div class="card">
    <div class="card-header">Filters</div>
    <div class="card-body">
      <form th:action="@{/web/general-ledger}" method="get" class="row g-3">
        <div class="col-auto">
          <label for="from" class="form-label">From</label>
          <input type="date" id="from" name="from" class="form-control" required="required"/>
        </div>
        <div class="col-auto">
          <label for="to" class="form-label">To</label>
          <input type="date" id="to" name="to" class="form-control" required="required"/>
        </div>
        <div class="col-md-4">
          <label for="accountId" class="form-label">Account (optional)</label>
          <select id="accountId" name="accountId" class="form-select">
            <option value="">All accounts</option>
            <option th:each="acc : ${allAccounts}" th:value="${acc.id}" th:text="${acc.code + ' - ' + acc.name}">Account</option>
          </select>
        </div>
        <div class="col-auto d-flex align-items-end">
          <button type="submit" class="btn btn-primary">Show ledger</button>
        </div>
      </form>
    </div>
  </div>
</th:block>
</body>
</html>
