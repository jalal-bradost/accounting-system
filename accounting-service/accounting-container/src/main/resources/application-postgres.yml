spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/accounting_system
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        type:
          preferred_clob_mapping: TEXT
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
