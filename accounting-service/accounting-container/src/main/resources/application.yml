accounting:
  seed:
    # Idempotent seed for DEFAULT_COMPANY_ID accounts & journals (set false to skip)
    default-company-chart: true

spring:
  application:
    name: accounting-service
  datasource:
    url: jdbc:h2:mem:accounting;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect
