# Authentication (JWT) and rule-based authorization layered on RBAC.
# Keep enabled=false for local dev unless you configure a strong jwt.secret (≥32 bytes).
app:
  security:
    enabled: true
    seed-default-admin-password: admin
    jwt:
      secret: "dev-only-change-me-please-use-32b-minimum-secret!!"
      issuer: accounting-system
      expiration-minutes: 720
    authorization:
      strict: true
      deny-permission-codes: []
      grant-all-user-ids: []
  storage:
    product-images:
      location: ./data/product-images
      public-base-path: /media/product-images
      max-bytes: 5242880
    partner-images:
      location: ./data/partner-images
      public-base-path: /media/partner-images
      max-bytes: 5242880
    chatter-attachments:
      location: ./data/chatter-attachments
      public-base-path: /media/chatter-attachments
      max-bytes: 10485760
  messaging:
    enabled: false
    exchange: accounting.system.events

accounting:
  seed:
    # Idempotent seed for DEFAULT_COMPANY_ID accounts & journals (set false to skip)
    default-company-chart: true
    # Demo partners, products, PO/SO, vendor bill, customer invoice, and payments (idempotent; disable in production)
    demo-business-data: false
  # Company currencies: base USD + optional extras (seeded once per company when table is empty)
  currencies:
    seed: true
    base:
      code: USD
      symbol: "$"
      name: United States dollar
    extras:
      - code: IQD
        symbol: "د.ع"
        name: Iraqi dinar
        # Units of IQD per 1 USD (adjust to market)
        rate-per-usd: "1310.000000"
        active: true
  cors:
    # Comma-separated list of origins allowed to call /api/v1/**
    # The Next.js dev server runs on http://localhost:3000 by default.
    allowed-origins: http://localhost:3000

spring:
  application:
    name: accounting-service
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  datasource:
    url: jdbc:h2:mem:accounting;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        type:
          preferred_clob_mapping: TEXT
    database-platform: org.hibernate.dialect.H2Dialect
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1s
          max-attempts: 4
          max-interval: 10s
          multiplier: 2.0
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
