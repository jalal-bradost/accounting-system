# Authentication (JWT) and rule-based authorization layered on RBAC.
# Keep enabled=false for local dev unless you configure a strong jwt.secret (≥32 bytes).
app:
  security:
    enabled: true
    seed-default-admin-password: admin
    jwt:
      secret: "dev-only-change-me-please-use-32b-minimum-secret!!"
      issuer: bradox-erp
      expiration-minutes: 720
    authorization:
      strict: true
      deny-permission-codes: []
      grant-all-user-ids: []
  storage:
    product-images:
      location: ./data/product-images
      public-base-path: /media/product-images
      max-bytes: 5242880
    partner-images:
      location: ./data/partner-images
      public-base-path: /media/partner-images
      max-bytes: 5242880
    company-logos:
      location: ./data/company-logos
      public-base-path: /media/company-logos
      max-bytes: 5242880
    employee-images:
      location: ./data/employee-images
      public-base-path: /media/employee-images
      max-bytes: 5242880
    chatter-attachments:
      location: ./data/chatter-attachments
      public-base-path: /media/chatter-attachments
      max-bytes: 10485760
    # Documents module. Files are served only through the authenticated API, never from a public path.
    documents:
      location: ./data/documents
  documents:
    max-bytes: 26214400       # 25 MB per file
    quota-bytes: 0            # 0 = unlimited storage per company
    purge-cron: "0 30 3 * * *" # permanently delete documents trashed more than 30 days ago
  messaging:
    enabled: false
    exchange: accounting.system.events
  ai:
    enabled: false
    provider: hybrid
    ollama:
      enabled: true
      base-url: http://localhost:11434
      model: qwen2.5:3b
      connect-timeout-ms: 5000
      read-timeout-ms: 120000
    google:
      enabled: false
      api-key: ""
      model: gemini-3.8-flash
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      connect-timeout-ms: 5000
      read-timeout-ms: 120000
    openai:
      enabled: false
      api-key: ""
      model: gpt-4o-mini
      base-url: https://api.openai.com/v1
      connect-timeout-ms: 5000
      read-timeout-ms: 120000
    max-tool-rounds: 4
    max-history-messages: 12
    max-date-range-days: 366
    write-operations-enabled: false

accounting:
  seed:
    # Always seed DEFAULT_COMPANY_ID chart of accounts and journals (idempotent)
    default-company-chart: true
    # Demo partners, products, PO/SO, vendor bill, customer invoice, and payments (idempotent; disable in production)
    demo-business-data: false
  # Company currencies: IQD base (Iraqi market default) + optional extras
  currencies:
    seed: true
    base:
      code: IQD
      symbol: "IQD"
      name: Iraqi dinar
    extras:
      - code: USD
        symbol: "$"
        name: United States dollar
        # Units of this currency per 1 base unit (USD per 1 IQD ≈ 1/1310)
        rate-per-usd: "0.000763358778"
        active: true
  cors:
    # Comma-separated list of origins allowed to call /api/v1/**
    # The Next.js dev server runs on http://localhost:3000 by default.
    allowed-origins: http://localhost:3000

inventory:
  seed:
    # Always seed UoMs, warehouse WH, and product category "All"
    default-company: true

hr:
  seed:
    # Demo departments and employees (idempotent; disable in production)
    demo-data: false

spring:
  application:
    name: bradox-erp
  # Long-lived requests (SSE) must not hold a JDBC connection for the whole stream;
  # application services already use @Transactional for DB work.
  jpa:
    open-in-view: false
  profiles:
    default: dev
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1s
          max-attempts: 4
          max-interval: 10s
          multiplier: 2.0
  servlet:
    multipart:
      max-file-size: 26MB
      max-request-size: 60MB
