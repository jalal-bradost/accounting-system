name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Maven verify (H2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: mvn -B verify -pl accounting-service/accounting-container -am

  mysql-smoke:
    name: MySQL Flyway + boot smoke
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: erp
          MYSQL_USER: erp
          MYSQL_PASSWORD: erp
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Package
        run: mvn -B -DskipTests package -pl accounting-service/accounting-container -am

      - name: Boot against MySQL
        env:
          SPRING_PROFILES_ACTIVE: prod
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_NAME: erp
          DB_USERNAME: erp
          DB_PASSWORD: erp
          APP_SECURITY_JWT_SECRET: ci-only-change-me-please-use-32b-minimum-secret!!
          APP_SECURITY_SEED_DEFAULT_ADMIN_PASSWORD: admin
          ACCOUNTING_CORS_ALLOWED_ORIGINS: http://localhost:3000
        run: |
          set -euo pipefail
          java -jar accounting-service/accounting-container/target/accounting-container-*.jar > /tmp/erp-boot.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/v1/auth/security-config >/dev/null; then
              echo "MySQL boot OK"
              exit 0
            fi
            if ! kill -0 $PID 2>/dev/null; then
              echo "Process died"
              tail -100 /tmp/erp-boot.log
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for app"
          tail -100 /tmp/erp-boot.log
          exit 1
